<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドパドパダッシュ</title>
<meta name="description" content="四角いキャラでトゲとブロックをよけまくれ！音楽に合わせて画面が光ってゆれる、演出MAXのジャンプアクション。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Orbitron:wght@700;900&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one screen, a neon arcade cabinet. The canvas is the whole game; menus are glowing panels on top. */
:root {
  --night: #0b0420;
  --night-2: #1a0b3d;
  --text: #f5f0ff;
  --text-dim: rgba(245, 240, 255, .66);
  --magenta: #ff2bd6;
  --cyan: #22f2ff;
  --yellow: #ffe23d;
  --lime: #7dff4a;
  --font-pop: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-num: "Orbitron", "Arial Black", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--night);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#app { position: relative; height: 100%; background: var(--night); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  padding: 16px;
  overflow: auto;
  background: radial-gradient(ellipse at center, rgba(26, 11, 61, .55), rgba(11, 4, 32, .88));
}
.panel {
  margin: auto;
  width: 100%;
  max-width: 30rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(8px, 1.8vh, 14px);
  text-align: center;
}
.logo {
  margin: 0;
  font-family: var(--font-pop);
  font-weight: 400;
  font-size: clamp(2rem, min(11vw, 9vh), 4.4rem);
  line-height: 1.05;
  color: var(--yellow);
  text-shadow: 3px 3px 0 var(--magenta), 6px 6px 0 var(--cyan), 0 0 24px rgba(255, 43, 214, .6);
  text-wrap: balance;
  transform: rotate(-4deg);
  animation: wobble 1.1s ease-in-out infinite alternate;
}
.logo span { display: block; font-size: .42em; color: var(--cyan); text-shadow: 2px 2px 0 var(--magenta); letter-spacing: .08em; }
@keyframes wobble { from { transform: rotate(-5deg) scale(1); } to { transform: rotate(-2deg) scale(1.05); } }
.how {
  margin: 0;
  padding: 12px 16px;
  width: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(4px, 1vh, 8px) 14px;
  text-align: left;
  border: 2px solid rgba(34, 242, 255, .5);
  border-radius: 14px;
  background: rgba(11, 4, 32, .6);
  box-shadow: 0 0 18px rgba(34, 242, 255, .25) inset;
}
.how dt { font-family: var(--font-pop); color: var(--cyan); white-space: nowrap; }
.how dd { margin: 0; min-width: 0; font-weight: 500; }
.go {
  font-family: var(--font-pop);
  font-size: 1.8rem;
  color: var(--night);
  background: linear-gradient(180deg, var(--yellow), #ffb31a);
  border: 0;
  border-radius: 16px;
  padding: 14px 44px;
  cursor: pointer;
  box-shadow: 0 6px 0 #b8560b, 0 0 30px rgba(255, 226, 61, .7);
  animation: pulse .46s ease-in-out infinite alternate;
}
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8560b, 0 0 30px rgba(255, 226, 61, .7); }
.go:focus-visible, .chip:focus-visible { outline: 3px dashed var(--cyan); outline-offset: 4px; }
@keyframes pulse { from { scale: 1; } to { scale: 1.07; } }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.chip {
  font: inherit;
  font-size: .9rem;
  font-weight: 800;
  color: var(--text);
  background: rgba(26, 11, 61, .8);
  border: 2px solid var(--magenta);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
.chip:hover { background: rgba(255, 43, 214, .25); }
.note { margin: 0; font-size: .8rem; color: var(--text-dim); max-width: 26rem; }
.best { font-family: var(--font-num); font-size: 1rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.rank {
  font-family: var(--font-num);
  font-weight: 900;
  font-size: clamp(5rem, 24vw, 8rem);
  line-height: 1;
  color: var(--yellow);
  text-shadow: 4px 4px 0 var(--magenta), 8px 8px 0 var(--cyan);
  animation: slam .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
.rank.kanji { font-family: var(--font-pop); }
@keyframes slam { from { transform: scale(3) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
.cause { margin: 0; font-family: var(--font-pop); font-size: 1.3rem; color: var(--magenta); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin: 0; width: 100%; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats dt { font-size: .8rem; color: var(--text-dim); }
.stats dd { margin: 0; font-family: var(--font-num); font-weight: 900; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.newrec {
  font-family: var(--font-pop);
  font-size: 1.4rem;
  color: var(--lime);
  text-shadow: 0 0 14px var(--lime);
  animation: pulse .3s ease-in-out infinite alternate;
}
.tap { font-size: .9rem; color: var(--text-dim); }
#corner { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; z-index: 3; }
#corner .chip { font-size: .78rem; padding: 4px 10px; border-width: 1px; }
@media (prefers-reduced-motion: reduce) {
  .logo, .go, .newrec, .rank { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="ゲーム画面。タップか長押しでジャンプ"></canvas>

  <section class="overlay" id="titleOv">
    <div class="panel">
      <h1 class="logo"><span>DOPA DOPA</span>ドパドパ<br>ダッシュ!!</h1>
      <dl class="how">
        <dt>タップ</dt><dd>ジャンプ（スペースキーでもOK）</dd>
        <dt>長押し</dt><dd>着地したしゅんかんに連続ジャンプ</dd>
        <dt>トゲ・穴</dt><dd>さわったら爆発</dd>
        <dt>ブロック</dt><dd>上には乗れる。横からぶつかると爆発</dd>
        <dt>黄色い輪</dt><dd>空中でタップするともう1回ジャンプ</dd>
        <dt>コンボ40</dt><dd>FEVER突入！トゲをこわして進め</dd>
      </dl>
      <button class="go" id="startBtn" type="button">スタート!!</button>
      <div class="row">
        <button class="chip" id="fxBtn" type="button">演出：MAX</button>
      </div>
      <p class="note">画面がはげしく光ったりゆれたりします。目がつかれたり気分が悪くなったら「演出：ひかえめ」にして、休けいしてください。</p>
      <div class="best" id="titleBest"></div>
    </div>
  </section>

  <section class="overlay" id="overOv" hidden>
    <div class="panel">
      <div class="rank" id="rank">S</div>
      <p class="cause" id="cause"></p>
      <div class="newrec" id="newrec" hidden>NEW RECORD!!</div>
      <dl class="stats">
        <div><dt>スコア</dt><dd id="sScore">0</dd></div>
        <div><dt>きょり</dt><dd id="sDist">0m</dd></div>
        <div><dt>最大コンボ</dt><dd id="sCombo">0</dd></div>
        <div><dt>ベスト</dt><dd id="sBest">0</dd></div>
      </dl>
      <button class="go" id="retryBtn" type="button">もう1回!!</button>
      <div class="tap">画面タップかスペースキーでもリトライ</div>
    </div>
  </section>

  <div id="corner">
    <button class="chip" id="fxBtn2" type="button">演出：MAX</button>
    <button class="chip" id="muteBtn" type="button">音：ON</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- tuning ----------
  const U = 40;                 // one grid unit in logical px
  const G = 2700;               // gravity
  const JUMP = 830;
  const PAD_V = 1150;
  const ORB_V = 880;
  const BPM = 140;
  const F_POP = '"Mochiy Pop One","Hiragino Maru Gothic ProN",sans-serif';
  const F_NUM = '"Orbitron","Arial Black",sans-serif';
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PRAISE = ['NICE!', 'いいね!', 'うまい!', 'GOOD!', 'さすが!', 'COOL!', 'ナイス!', 'やるじゃん!'];
  const MILESTONES = {
    5: 'NICE!!', 10: 'GREAT!!', 20: 'EXCELLENT!!', 30: 'AMAZING!!!', 40: 'FEVER!!!!',
    60: 'INSANE!!!', 80: 'GODLIKE!!!!', 100: '神!!!!!', 150: '超神!!!!!!', 200: '宇宙!!!!!!!'
  };
  const CAUSES = {
    spike: ['トゲにささった!!', 'チクッ!!', 'トゲ、いたい!!'],
    block: ['かべに激突!!', 'ゴンッ!!', 'ブロックかたすぎ!!'],
    pit: ['奈落へ落ちた!!', 'ヒュ〜〜ン…', '穴に吸いこまれた!!']
  };

  // Patterns in grid units. s=spike(x,y) b=block(x,y,w,h) pit(x,w) pad(x) orb(x,y) c=coin(x,y)
  const PATTERNS = [
    { lv: 1, len: 1, o: [['s', 0, 0]], c: [[0.5, 3]] },
    { lv: 1, len: 2, o: [['s', 0, 0], ['s', 1, 0]], c: [[1, 3.2]] },
    { lv: 1, len: 2, o: [['b', 0, 0, 2, 1]], c: [[0.5, 1.8], [1.5, 1.8]] },
    { lv: 1, len: 2, o: [['pit', 0, 2]], c: [[1, 2.6]] },
    { lv: 1, len: 6, o: [['pad', 0], ['b', 4, 0, 2, 2]], c: [[2, 5], [3, 5.4], [4, 5]] },
    { lv: 2, len: 3, o: [['s', 0, 0], ['s', 1, 0], ['s', 2, 0]], c: [[0.5, 3], [1.5, 3.4], [2.5, 3]] },
    { lv: 2, len: 5, o: [['b', 0, 0, 2, 1], ['s', 2, 0], ['b', 3, 0, 2, 2]], c: [[2.5, 3.6], [4, 3]] },
    { lv: 2, len: 3, o: [['pit', 0, 3]], c: [[0.5, 2.6], [1.5, 3.2], [2.5, 2.6]] },
    { lv: 2, len: 4, o: [['b', 0, 0, 4, 1], ['s', 2, 1]], c: [[2, 3.8]] },
    { lv: 3, len: 6, o: [['s', 0, 0], ['s', 1, 0], ['s', 2, 0], ['s', 3, 0], ['s', 4, 0], ['s', 5, 0], ['orb', 2.5, 2.6]], c: [[1, 3], [4, 4], [5, 3.6]] },
    { lv: 3, len: 5, o: [['pit', 0, 2], ['pit', 3, 2]], c: [[1, 2.6], [4, 2.6]] },
    { lv: 3, len: 6, o: [['pad', 0], ['s', 3, 0], ['s', 4, 0], ['s', 5, 0]], c: [[2.5, 5], [3.5, 5.6], [4.5, 5]] },
    { lv: 4, len: 7, o: [['b', 0, 0, 3, 1], ['s', 3, 0], ['s', 4, 0], ['b', 5, 0, 2, 2]], c: [[3.5, 3.6], [4.5, 3.8]] },
    { lv: 4, len: 4, o: [['pit', 0, 4]], c: [[1, 3], [2, 3.4], [3, 3]] }
  ];

  // ---------- canvas ----------
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 800, H = 450, scale = 1, dpr = 1, GY = 330, PX = 160;
  function resize() {
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    scale = Math.min(r.height / 420, r.width / 600);
    W = r.width / scale;
    H = r.height / scale;
    GY = Math.min(H - 70, H * 0.5 + 150);
    PX = Math.max(110, W * 0.24);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
  }
  window.addEventListener('resize', resize);

  // ---------- settings ----------
  let fxMax = !reduceMotion, muted = false, best = 0, attempts = 0;
  try {
    best = Number(localStorage.getItem('dopa-best')) || 0;
    const fx = localStorage.getItem('dopa-fx');
    if (fx) fxMax = fx === 'max';
  } catch (e) {}

  // ---------- audio ----------
  let actx = null, master = null, musicBus = null, musicFilter = null, sfxBus = null, noiseBuf = null;
  let nextStepTime = 0, step = 0, musicOn = false;
  const kickTimes = [];
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(actx.destination);
      musicFilter = actx.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 18000;
      musicBus = actx.createGain(); musicBus.gain.value = 0.55;
      musicBus.connect(musicFilter).connect(master);
      sfxBus = actx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(master);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  function env(g, t, a, peak, dec) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
  }
  function tone(type, f0, f1, t, dur, vol, bus = sfxBus, attack = 0.005) {
    const o = actx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = actx.createGain(); env(g, t, attack, vol, dur);
    o.connect(g).connect(bus); o.start(t); o.stop(t + attack + dur + 0.02);
  }
  function noise(t, dur, vol, type, freq, bus = sfxBus) {
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = actx.createGain(); env(g, t, 0.002, vol, dur);
    s.connect(f).connect(g).connect(bus); s.start(t); s.stop(t + dur + 0.05);
  }
  const CHORDS = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]];
  function playStep(st, t) {
    const bar = Math.floor(st / 16) % 4, s = st % 16, ch = CHORDS[bar];
    const intense = state === 'play' ? Math.min(4, level) : 1;
    if (s % 4 === 0) { tone('sine', 160, 42, t, 0.16, 0.9, musicBus); kickTimes.push(t); }
    if (intense >= 2 && (s === 4 || s === 12)) noise(t, 0.14, 0.4, 'bandpass', 1800, musicBus);
    if (s % 2 === 1 || (fever > 0 && s % 2 === 0)) noise(t, 0.035, s % 4 === 2 ? 0.18 : 0.1, 'highpass', 8000, musicBus);
    if (s % 2 === 0) tone('sawtooth', ch[0] / 2, ch[0] / 2, t, 0.11, 0.16, musicBus);
    if (intense >= 3 || fever > 0) tone('square', ch[s % 3] * 2, ch[s % 3] * 2, t, 0.07, fever > 0 ? 0.07 : 0.035, musicBus);
  }
  function scheduler() {
    if (!actx || !musicOn) return;
    const stepDur = 60 / BPM / 4;
    if (nextStepTime < actx.currentTime) nextStepTime = actx.currentTime + 0.05;
    while (nextStepTime < actx.currentTime + 0.12) {
      playStep(step, nextStepTime);
      nextStepTime += stepDur;
      step = (step + 1) % 64;
    }
    while (kickTimes.length > 4) kickTimes.shift();
  }
  function startMusic() {
    if (!actx) return;
    musicOn = true;
    musicFilter.frequency.cancelScheduledValues(actx.currentTime);
    musicFilter.frequency.setValueAtTime(18000, actx.currentTime);
  }
  function muffleMusic() {
    if (!actx) return;
    musicFilter.frequency.cancelScheduledValues(actx.currentTime);
    musicFilter.frequency.setValueAtTime(18000, actx.currentTime);
    musicFilter.frequency.exponentialRampToValueAtTime(380, actx.currentTime + 0.5);
  }
  // beat pulse 0..1, decays after each kick
  function beatPulse(nowReal) {
    if (actx && musicOn) {
      const now = actx.currentTime;
      let last = -1;
      for (const k of kickTimes) if (k <= now) last = k;
      return last < 0 ? 0 : Math.exp(-(now - last) * 9);
    }
    const spb = 60 / BPM;
    return Math.exp(-((nowReal / 1000) % spb) * 9);
  }
  const sfx = {
    jump() { if (actx) tone('square', 330, 660, actx.currentTime, 0.09, 0.12); },
    land() { if (actx) tone('sine', 120, 60, actx.currentTime, 0.06, 0.25); },
    coin(n) { if (!actx) return; const f = 880 * Math.pow(2, Math.min(n, 24) / 12); const t = actx.currentTime; tone('square', f, f, t, 0.05, 0.08); tone('square', f * 1.5, f * 1.5, t + 0.05, 0.08, 0.08); },
    orb() { if (!actx) return; const t = actx.currentTime; [0, 4, 7, 12].forEach((n, i) => tone('triangle', 660 * Math.pow(2, n / 12), 660 * Math.pow(2, n / 12), t + i * 0.03, 0.08, 0.15)); },
    pad() { if (actx) tone('sawtooth', 200, 1200, actx.currentTime, 0.25, 0.18); },
    clear() { if (!actx) return; const t = actx.currentTime; tone('square', 1046, 1046, t, 0.05, 0.06); tone('square', 1568, 1568, t + 0.05, 0.08, 0.06); },
    near() { if (!actx) return; const t = actx.currentTime; noise(t, 0.25, 0.35, 'bandpass', 3000); tone('sine', 1760, 2637, t, 0.2, 0.18); },
    milestone() { if (!actx) return; const t = actx.currentTime; [0, 4, 7, 12, 16, 19, 24].forEach((n, i) => tone('square', 523 * Math.pow(2, n / 12), 523 * Math.pow(2, n / 12), t + i * 0.045, 0.09, 0.09)); },
    fever() { if (!actx) return; const t = actx.currentTime; tone('sawtooth', 110, 1760, t, 0.9, 0.2); noise(t, 0.9, 0.25, 'bandpass', 2500); },
    smash() { if (!actx) return; const t = actx.currentTime; noise(t, 0.15, 0.5, 'lowpass', 1200); tone('square', 880, 220, t, 0.12, 0.12); },
    death() { if (!actx) return; const t = actx.currentTime; noise(t, 0.6, 0.9, 'lowpass', 900); tone('sawtooth', 440, 40, t, 0.6, 0.3); },
    levelUp() { if (!actx) return; const t = actx.currentTime; [0, 7, 12, 19, 24].forEach((n, i) => tone('sawtooth', 392 * Math.pow(2, n / 12), 392 * Math.pow(2, n / 12), t + i * 0.06, 0.12, 0.1)); }
  };

  // ---------- state ----------
  let state = 'title';
  let dist, speed, level, nextX, objs, pits, coins, parts, pops, trail;
  let P, holding, pressBuf, score, shownScore, combo, comboTimer, maxCombo, mult, fever, coinStreak;
  let shake, flash, zoom, timeScale, slowTimer, hue, deathTimer, deathCause, lastLevelAnnounce, attemptX;
  let tReal = 0, lastFrame = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function reset() {
    dist = 0; speed = 360; level = 1; nextX = U * 14;
    objs = []; pits = []; coins = []; parts = []; pops = []; trail = [];
    P = { h: 0, vh: 0, rot: 0, grounded: true, coyote: 0, squash: 0 };
    holding = false; pressBuf = 0;
    score = 0; shownScore = 0; combo = 0; comboTimer = 0; maxCombo = 0; mult = 1; fever = 0; coinStreak = 0;
    shake = 0; flash = 0; zoom = 0; timeScale = 1; slowTimer = 0; hue = 280; deathTimer = 0;
    lastLevelAnnounce = 1; attemptX = PX + U * 6;
    if (state === 'play') generate();
  }

  // ---------- level generation ----------
  function generate() {
    while (nextX < dist + W + U * 10) {
      const pool = PATTERNS.filter(p => p.lv <= level);
      const pat = pick(pool);
      const x0 = nextX;
      for (const o of pat.o) {
        const [t, a, b, c, d] = o;
        if (t === 's') objs.push({ t: 'spike', x: x0 + a * U, y: b * U, w: U, h: U });
        else if (t === 'b') objs.push({ t: 'block', x: x0 + a * U, y: b * U, w: c * U, h: d * U });
        else if (t === 'pit') pits.push({ x: x0 + a * U, w: b * U });
        else if (t === 'pad') objs.push({ t: 'pad', x: x0 + a * U, y: 0, w: U, h: U * 0.3 });
        else if (t === 'orb') objs.push({ t: 'orb', x: x0 + a * U, y: b * U, used: false });
      }
      for (const [cx, cy] of pat.c) coins.push({ x: x0 + cx * U, y: cy * U, got: false, spin: Math.random() * 6 });
      objs.push({ t: 'mark', x: x0 + pat.len * U, done: false });
      const gap = Math.round(rand(4, 7) + (speed - 360) / 70);
      // a little coin line on the flat between patterns
      if (Math.random() < 0.6) for (let i = 1; i < gap - 1; i++) coins.push({ x: x0 + (pat.len + i) * U + U / 2, y: U * 0.6, got: false, spin: i });
      nextX = x0 + (pat.len + gap) * U;
    }
    objs = objs.filter(o => o.x + (o.w || U) > dist - U * 4);
    pits = pits.filter(p => p.x + p.w > dist - U * 4);
    coins = coins.filter(c => c.x > dist - U * 4 && !c.got);
  }

  // ---------- helpers ----------
  const sx = wx => wx - dist + PX;           // world x -> screen x
  const overlapsGround = (x0, x1) => {
    // true if any part of [x0,x1] is over solid ground
    for (const p of pits) if (x0 >= p.x && x1 <= p.x + p.w) return false;
    return true;
  };

  function addCombo(n, label) {
    combo += n;
    comboTimer = 3;
    maxCombo = Math.max(maxCombo, combo);
    const newMult = Math.min(8, 1 + Math.floor(combo / 8));
    if (newMult > mult) { pop(`×${newMult}`, PX + 40, GY - 150, '#7dff4a', 40, 1.1); zoom = Math.max(zoom, 0.05); }
    mult = newMult;
    for (const k of Object.keys(MILESTONES)) {
      const m = Number(k);
      if (combo - n < m && combo >= m) milestone(MILESTONES[k], m);
    }
    if (label) pop(label, PX + rand(-10, 30), GY - P.h - 70, pick(['#22f2ff', '#ff2bd6', '#ffe23d', '#7dff4a']), 26, 0.7);
  }
  function milestone(text, m) {
    pop(text, W / 2, H * 0.32, '#ffe23d', m >= 40 ? 76 : 60, 1.5, true);
    sfx.milestone();
    flash = Math.max(flash, 0.3);
    shake = Math.max(shake, 0.5);
    zoom = Math.max(zoom, 0.1);
    burst(W / 2, H * 0.32, 60, null, 520);
    if (m === 40 || (m > 40 && fever <= 0 && m % 40 === 0)) startFever();
  }
  function startFever() {
    fever = 8;
    sfx.fever();
    pop('FEVER TIME!!', W / 2, H * 0.48, '#ff2bd6', 52, 1.6, true);
  }
  function addScore(n) { score += n * mult * (fever > 0 ? 2 : 1); }

  function pop(text, x, y, color, size, life, big) {
    pops.push({ text, x, y, color, size, life, max: life, big: !!big, rot: rand(-0.15, 0.15), vy: big ? 0 : -60 });
  }
  function burst(x, y, n, color, spd = 300, kind = 'spark') {
    if (!fxMax) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd);
      parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: kind === 'shard' ? 900 : 300,
        life: rand(0.4, 1), max: 1, size: kind === 'shard' ? rand(6, 14) : rand(2, 5),
        color: color || `hsl(${Math.floor(Math.random() * 360)} 100% 65%)`, kind, rot: Math.random() * 6, vr: rand(-12, 12)
      });
    }
    if (parts.length > 700) parts.splice(0, parts.length - 700);
  }
  function ring(x, y, color, r = 60) {
    parts.push({ x, y, vx: 0, vy: 0, g: 0, life: 0.45, max: 0.45, size: r, color, kind: 'ring' });
  }

  // ---------- update ----------
  function update(dtReal) {
    tReal += dtReal;
    if (slowTimer > 0) { slowTimer -= dtReal; if (slowTimer <= 0) timeScale = 1; }
    const dt = dtReal * timeScale;

    // effects decay (real time)
    shake = Math.max(0, shake - dtReal * 2.2);
    flash = Math.max(0, flash - dtReal * 2.5);
    zoom = Math.max(0, zoom - dtReal * 0.6);
    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.99; p.life -= dt; if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
    }
    parts = parts.filter(p => p.life > 0);
    for (const p of pops) { p.life -= dtReal; p.y += p.vy * dtReal; }
    pops = pops.filter(p => p.life > 0);
    shownScore += (score - shownScore) * Math.min(1, dtReal * 10);
    if (Math.abs(score - shownScore) < 1) shownScore = score;

    hue = (hue + dtReal * (fever > 0 ? 220 : 12)) % 360;

    if (state === 'title') {
      dist += 200 * dtReal;
      P.rot += dtReal * 4;
      P.h = Math.abs(Math.sin(tReal * 3.2)) * 70;
      return;
    }
    if (state === 'dead') {
      deathTimer += dtReal;
      if (deathTimer > 1.0 && overOv.hidden) showResult();
      return;
    }
    if (state !== 'play') return;

    // --- play ---
    const newLevel = 1 + Math.floor(dist / (U * 160));
    if (newLevel > level) {
      level = newLevel;
      speed = Math.min(640, 360 + (level - 1) * 40);
      if (level > lastLevelAnnounce) {
        lastLevelAnnounce = level;
        pop('SPEED UP!!', W / 2, H * 0.22, '#22f2ff', 56, 1.4, true);
        pop(`LEVEL ${level}`, W / 2, H * 0.22 + 56, '#ffe23d', 30, 1.4, true);
        sfx.levelUp();
        flash = Math.max(flash, 0.25);
        zoom = Math.max(zoom, 0.08);
      }
    }
    if (fever > 0) { fever -= dt; if (fever <= 0) pop('FEVER END', W / 2, H * 0.3, '#f5f0ff', 32, 1, true); }
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0 && combo > 0) { if (combo >= 5) pop('COMBO BREAK…', PX + 60, GY - 160, '#9a8fb5', 22, 1); combo = 0; mult = 1; }
    }

    dist += speed * dt;
    score += speed * dt / U * mult * (fever > 0 ? 2 : 1);
    if (nextX < dist + W + U * 10) generate();

    pressBuf = Math.max(0, pressBuf - dt);
    const px0 = dist + 3, px1 = dist + U - 3;

    // physics
    const prevH = P.h;
    P.vh -= G * dt;
    P.h += P.vh * dt;

    // landing on surfaces
    let landed = false;
    const surfaces = [];
    if (overlapsGround(px0, px1)) surfaces.push(0);
    for (const o of objs) if (o.t === 'block' && px1 > o.x && px0 < o.x + o.w) surfaces.push(o.y + o.h);
    for (const top of surfaces) {
      if (P.vh <= 0 && prevH >= top - 2 && P.h <= top + 0.01) {
        P.h = top; P.vh = 0; landed = true;
      }
    }
    const wasGrounded = P.grounded;
    P.grounded = landed;
    if (landed) {
      P.coyote = 0.08;
      if (!wasGrounded) {
        sfx.land();
        P.squash = 1;
        P.rot = Math.round(P.rot / (Math.PI / 2)) * (Math.PI / 2);
        burst(PX + U / 2, GY - P.h, 8, '#22f2ff', 160);
        shake = Math.max(shake, 0.08);
      }
    } else {
      P.coyote -= dt;
      P.rot += dt * (Math.PI / 0.62);
    }
    if ((P.grounded || P.coyote > 0) && (holding || pressBuf > 0) && P.vh <= 0) jump(JUMP);

    // hazards
    const hb = { x0: dist + 5, x1: dist + U - 5, y0: P.h + 4, y1: P.h + U - 4 };
    for (const o of objs) {
      if (o.t === 'block') {
        const solidTop = o.y + o.h;
        if (hb.x1 > o.x && hb.x0 < o.x + o.w && hb.y1 > o.y && P.h < solidTop - 1) {
          if (fever > 0) { smash(o); continue; }
          return die('block');
        }
      } else if (o.t === 'spike' && !o.smashed) {
        const k0 = o.x + U * 0.28, k1 = o.x + U * 0.72, top = o.y + U * 0.6;
        if (hb.x1 > k0 && hb.x0 < k1) {
          if (hb.y0 < top && hb.y1 > o.y) {
            if (fever > 0) { smash(o); continue; }
            return die('spike');
          }
          if (hb.y0 - top < 16) o.near = true;
        }
        if (o.near && !o.nearDone && o.x + U < dist) {
          o.nearDone = true;
          nearMiss();
        }
      } else if (o.t === 'pad' && !o.used) {
        if (px1 > o.x && px0 < o.x + o.w && P.h < 14) {
          o.used = true;
          jump(PAD_V, true);
          sfx.pad();
          burst(sx(o.x + U / 2), GY, 30, '#ffe23d', 420);
          ring(sx(o.x + U / 2), GY, '#ffe23d', 80);
          addCombo(1, 'BOING!');
          addScore(30);
        }
      } else if (o.t === 'orb' && !o.used) {
        const cx = o.x + U / 2, cy = o.y + U / 2;
        const d = Math.hypot(cx - (dist + U / 2), cy - (P.h + U / 2));
        if (d < 52 && !P.grounded && (holding || pressBuf > 0)) {
          o.used = true;
          pressBuf = 0;
          jump(ORB_V, true);
          sfx.orb();
          ring(sx(cx), GY - cy, '#ffe23d', 90);
          burst(sx(cx), GY - cy, 24, '#ffe23d', 360);
          addCombo(2, 'ORB!!');
          addScore(50);
        }
      } else if (o.t === 'mark' && !o.done && o.x < dist) {
        o.done = true;
        sfx.clear();
        addCombo(1, combo % 5 === 4 ? null : pick(PRAISE));
        addScore(100);
      }
    }
    // pits
    // below floor level but partly over solid ground: ran into the far wall of a pit
    if (P.h < -6 && overlapsGround(dist + 4, dist + U - 4)) return die('pit');
    if (P.h < -U * 2.5) return die('pit');

    // coins
    for (const c of coins) {
      if (c.got) continue;
      if (Math.abs(c.x - (dist + U / 2)) < 30 && Math.abs(c.y - (P.h + U / 2)) < 34) {
        c.got = true;
        coinStreak++;
        sfx.coin(coinStreak % 25);
        burst(sx(c.x), GY - c.y, 10, '#ffe23d', 240);
        addCombo(1, null);
        addScore(50);
        pop('+' + 50 * mult * (fever > 0 ? 2 : 1), sx(c.x), GY - c.y - 20, '#ffe23d', 18, 0.5);
      }
    }

    // trail
    trail.push({ x: dist, h: P.h, rot: P.rot, hue });
    if (trail.length > (fxMax ? 14 : 5)) trail.shift();
    P.squash = Math.max(0, P.squash - dt * 6);
  }

  function jump(v, special) {
    P.vh = v;
    P.grounded = false;
    P.coyote = 0;
    pressBuf = 0;
    if (!special) sfx.jump();
    burst(PX + U / 2, GY - P.h, special ? 16 : 6, special ? '#ffe23d' : '#ff2bd6', 200);
  }
  function smash(o) {
    o.smashed = true;
    if (o.t === 'block') objs.splice(objs.indexOf(o), 1);
    sfx.smash();
    shake = Math.max(shake, 0.3);
    burst(sx(o.x + U / 2), GY - o.y - U / 2, 26, null, 480, 'shard');
    pop('粉砕!!', sx(o.x), GY - o.y - 60, '#ff2bd6', 34, 0.7);
    addCombo(2, null);
    addScore(150);
  }
  function nearMiss() {
    sfx.near();
    pop('ギリギリ!!', PX + 30, GY - P.h - 90, '#7dff4a', 36, 0.9);
    addCombo(2, null);
    addScore(200);
    zoom = Math.max(zoom, 0.07);
    if (fxMax) { timeScale = 0.35; slowTimer = 0.18; }
    flash = Math.max(flash, 0.15);
  }
  function die(cause) {
    state = 'dead';
    deathCause = cause;
    deathTimer = 0;
    holding = false;
    sfx.death();
    muffleMusic();
    const x = PX + U / 2, y = GY - P.h - U / 2;
    burst(x, y, 70, null, 620, 'shard');
    burst(x, y, 60, '#ffe23d', 520);
    ring(x, y, '#ff2bd6', 140);
    ring(x, y, '#22f2ff', 90);
    shake = 1;
    flash = 0.45;
    zoom = 0.15;
    if (fxMax) { timeScale = 0.3; slowTimer = 0.7; }
  }

  // ---------- drawing ----------
  const skyline = Array.from({ length: 24 }, (_, i) => ({ x: i * 70 + Math.random() * 30, w: rand(40, 70), h: rand(60, 200), win: Math.random() }));
  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.4, tw: Math.random() * 6 }));

  function hsl(h, s, l, a = 1) { return `hsla(${h % 360},${s}%,${l}%,${a})`; }

  function drawBackground(beat) {
    const h = hue;
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, hsl(h, 70, 8));
    g.addColorStop(1, hsl(h + 40, 80, 22 + beat * (fxMax ? 8 : 2)));
    ctx.fillStyle = g;
    ctx.fillRect(-50, -50, W + 100, H + 100);
    // stars
    for (const s of stars) {
      const a = 0.4 + 0.6 * Math.abs(Math.sin(tReal * 2 + s.tw));
      ctx.fillStyle = `rgba(255,255,255,${a * 0.7})`;
      const x = ((s.x * W - dist * 0.05) % W + W) % W;
      ctx.fillRect(x, s.y * GY * 0.8, s.s, s.s);
    }
    // sun / disc pulsing to the beat
    const r = 70 + beat * (fxMax ? 16 : 4);
    const sg = ctx.createLinearGradient(0, GY * 0.25 - r, 0, GY * 0.25 + r);
    sg.addColorStop(0, hsl(h + 60, 100, 65));
    sg.addColorStop(1, hsl(h + 320, 100, 55));
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(W * 0.72, GY * 0.42, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hsl(h, 70, 10, 0.9);
    for (let i = 0; i < 5; i++) ctx.fillRect(W * 0.72 - r, GY * 0.42 + i * 14 + 6, r * 2, 3 + i);
    // skyline
    const span = 24 * 70;
    for (const b of skyline) {
      const x = ((b.x - dist * 0.2) % span + span) % span - 70;
      if (x > W + 80) continue;
      ctx.fillStyle = hsl(h + 20, 60, 10);
      ctx.fillRect(x, GY - b.h, b.w, b.h);
      ctx.fillStyle = hsl(h + 180, 100, 70, 0.25 + beat * 0.3);
      for (let wy = GY - b.h + 10; wy < GY - 10; wy += 16) for (let wx = x + 6; wx < x + b.w - 8; wx += 12) if ((wx * 7 + wy * 3 + b.win * 100) % 5 < 2) ctx.fillRect(wx, wy, 5, 7);
    }
    // rotating outline squares (mid layer)
    ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const x = ((i * 220 - dist * 0.4) % 1320 + 1320) % 1320 - 100;
      const y = GY * 0.3 + Math.sin(i * 1.7) * 60;
      const s = 30 + (i % 3) * 16 + beat * (fxMax ? 10 : 2);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tReal * (0.6 + i * 0.2) * (i % 2 ? 1 : -1));
      ctx.strokeStyle = hsl(h + i * 50, 100, 65, 0.35);
      ctx.strokeRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    }
  }

  function drawGround(beat) {
    const h = hue;
    // floor fill
    const g = ctx.createLinearGradient(0, GY, 0, H);
    g.addColorStop(0, hsl(h + 200, 80, 18));
    g.addColorStop(1, hsl(h + 240, 80, 5));
    ctx.fillStyle = g;
    ctx.fillRect(-50, GY, W + 100, H - GY + 60);
    // perspective grid
    ctx.strokeStyle = hsl(h + 180, 100, 60, 0.35 + beat * 0.3);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 1; i < 8; i++) {
      const y = GY + Math.pow(i / 8, 1.8) * (H - GY);
      ctx.moveTo(-50, y); ctx.lineTo(W + 50, y);
    }
    const off = dist % U;
    for (let x = -off - U * 10; x < W + U * 10; x += U) {
      const xs = x + PX % U;
      ctx.moveTo(xs, GY);
      ctx.lineTo(W / 2 + (xs - W / 2) * 3, H + 10);
    }
    ctx.stroke();
    // pits: punch holes
    for (const p of pits) {
      const x = sx(p.x);
      if (x > W + 20 || x + p.w < -20) continue;
      const pg = ctx.createLinearGradient(0, GY, 0, H);
      pg.addColorStop(0, '#000');
      pg.addColorStop(1, hsl(h + 300, 90, 12));
      ctx.fillStyle = pg;
      ctx.fillRect(x, GY - 1, p.w, H - GY + 60);
      ctx.strokeStyle = '#ff2bd6';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x, H); ctx.moveTo(x + p.w, GY); ctx.lineTo(x + p.w, H); ctx.stroke();
    }
    // neon edge line, skipping pits
    ctx.strokeStyle = hsl(h + 180, 100, 70);
    ctx.lineWidth = 4;
    if (fxMax) { ctx.shadowColor = hsl(h + 180, 100, 60); ctx.shadowBlur = 14 + beat * 14; }
    ctx.beginPath();
    let cur = -60;
    const sorted = pits.map(p => [sx(p.x), sx(p.x + p.w)]).sort((a, b) => a[0] - b[0]);
    for (const [a, b] of sorted) { if (a > cur) { ctx.moveTo(cur, GY); ctx.lineTo(a, GY); } cur = Math.max(cur, b); }
    ctx.moveTo(cur, GY); ctx.lineTo(W + 60, GY);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawObjects(beat) {
    for (const o of objs) {
      const x = sx(o.x);
      if (x > W + 80 || x + (o.w || U) < -80) continue;
      if (o.t === 'spike' && !o.smashed) {
        const y = GY - o.y;
        ctx.fillStyle = '#12051f';
        ctx.strokeStyle = o.near ? '#7dff4a' : '#ff2bd6';
        ctx.lineWidth = 3;
        if (fxMax) { ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 10; }
        ctx.beginPath(); ctx.moveTo(x + 2, y); ctx.lineTo(x + U / 2, y - U + 2); ctx.lineTo(x + U - 2, y); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,43,214,.35)';
        ctx.beginPath(); ctx.moveTo(x + 12, y); ctx.lineTo(x + U / 2, y - U * 0.55); ctx.lineTo(x + U - 12, y); ctx.closePath(); ctx.fill();
      } else if (o.t === 'block') {
        const y = GY - o.y - o.h;
        ctx.fillStyle = hsl(hue + 220, 70, 14);
        ctx.fillRect(x, y, o.w, o.h);
        ctx.strokeStyle = hsl(hue + 180, 100, 65);
        ctx.lineWidth = 3;
        if (fxMax) { ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8 + beat * 10; }
        ctx.strokeRect(x + 1.5, y + 1.5, o.w - 3, o.h - 3);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = hsl(hue + 180, 100, 65, 0.3);
        ctx.lineWidth = 1.5;
        for (let gx = x; gx < x + o.w; gx += U) for (let gy = y; gy < y + o.h; gy += U) ctx.strokeRect(gx + 7, gy + 7, U - 14, U - 14);
      } else if (o.t === 'pad') {
        const y = GY;
        ctx.fillStyle = '#ffe23d';
        if (fxMax) { ctx.shadowColor = '#ffe23d'; ctx.shadowBlur = 16; }
        ctx.beginPath(); ctx.ellipse(x + U / 2, y, U / 2, 10 + beat * 4, 0, Math.PI, 0); ctx.fill();
        ctx.shadowBlur = 0;
      } else if (o.t === 'orb' && !o.used) {
        const cx = x + U / 2, cy = GY - o.y - U / 2;
        const r = 15 + beat * 4;
        ctx.strokeStyle = '#ffe23d';
        ctx.lineWidth = 4;
        if (fxMax) { ctx.shadowColor = '#ffe23d'; ctx.shadowBlur = 18; }
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,226,61,.35)';
        ctx.beginPath(); ctx.arc(cx, cy, r - 6, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,226,61,.4)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, r + 8 + Math.sin(tReal * 8) * 4, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // coins
    for (const c of coins) {
      if (c.got) continue;
      const x = sx(c.x), y = GY - c.y;
      if (x < -30 || x > W + 30) continue;
      const w = Math.abs(Math.cos(tReal * 5 + c.spin)) * 10 + 2;
      ctx.fillStyle = '#ffe23d';
      ctx.beginPath(); ctx.ellipse(x, y, w, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffb31a';
      ctx.beginPath(); ctx.ellipse(x, y, w * 0.5, 6, 0, 0, Math.PI * 2); ctx.fill();
    }
    // attempt counter written into the world
    const ax = attemptX - dist;
    if (ax > -400 && ax < W + 200 && state !== 'title') {
      ctx.font = `34px ${F_POP}`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = 'rgba(245,240,255,.85)';
      ctx.fillText(`ATTEMPT ${attempts}`, ax, GY - 170);
    }
  }

  function drawPlayer() {
    if (state === 'dead' || state === 'result') return;
    // trail
    trail.forEach((t, i) => {
      const a = (i + 1) / trail.length;
      ctx.save();
      ctx.translate(PX - (dist - t.x) + U / 2, GY - t.h - U / 2);
      ctx.rotate(t.rot);
      ctx.fillStyle = fever > 0 ? hsl(t.hue + i * 25, 100, 60, a * 0.5) : `rgba(34,242,255,${a * 0.3})`;
      const s = U * (0.4 + a * 0.5);
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    });
    const cx = PX + U / 2, cy = GY - P.h - U / 2;
    ctx.save();
    ctx.translate(cx, cy + P.squash * 4);
    ctx.scale(1 + P.squash * 0.18, 1 - P.squash * 0.18);
    ctx.rotate(P.rot);
    const main = fever > 0 ? hsl(hue, 100, 60) : '#22f2ff';
    if (fxMax) { ctx.shadowColor = main; ctx.shadowBlur = 20; }
    ctx.fillStyle = main;
    ctx.fillRect(-U / 2, -U / 2, U, U);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#0b0420';
    ctx.lineWidth = 3;
    ctx.strokeRect(-U / 2 + 1.5, -U / 2 + 1.5, U - 3, U - 3);
    ctx.fillStyle = '#ff2bd6';
    ctx.fillRect(-U / 2 + 7, -U / 2 + 7, U - 14, U - 14);
    // face
    ctx.fillStyle = '#fff';
    ctx.fillRect(-10, -8, 8, 9); ctx.fillRect(3, -8, 8, 9);
    ctx.fillStyle = '#0b0420';
    ctx.fillRect(-7, -5, 4, 5); ctx.fillRect(6, -5, 4, 5);
    ctx.fillRect(-6, 5, 13, 3);
    ctx.restore();
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const a = Math.max(0, p.life / p.max);
      if (p.kind === 'ring') {
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = a;
        ctx.lineWidth = 6 * a;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.2 - a), 0, Math.PI * 2); ctx.stroke();
      } else if (p.kind === 'shard') {
        ctx.globalAlpha = Math.min(1, a * 1.5);
        ctx.fillStyle = p.color;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore();
      } else {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawSpeedLines() {
    if (!fxMax || state !== 'play') return;
    const n = fever > 0 ? 18 : Math.max(0, level - 1) * 3;
    ctx.strokeStyle = fever > 0 ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const y = (i * 97.3 + tReal * 13) % H;
      const x = W - ((tReal * 1800 + i * 333) % (W + 400));
      ctx.moveTo(x, y); ctx.lineTo(x + 80 + (i % 4) * 40, y);
    }
    ctx.stroke();
  }

  function drawPops() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const p of pops) {
      const age = p.max - p.life;
      const inT = Math.min(1, age / 0.12);
      const punch = p.big ? (1 + (1 - inT) * 1.6) : (0.6 + inT * 0.4);
      const wob = p.big && fxMax ? Math.sin(age * 30) * 0.04 * Math.max(0, 1 - age * 2) : 0;
      const a = Math.min(1, p.life / 0.25);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot + wob);
      ctx.scale(punch, punch);
      ctx.font = `${p.size}px ${F_POP}`;
      ctx.lineJoin = 'round';
      ctx.lineWidth = p.size * 0.22;
      ctx.strokeStyle = '#0b0420';
      ctx.strokeText(p.text, 0, 0);
      if (p.big) {
        ctx.fillStyle = '#ff2bd6';
        ctx.fillText(p.text, 4, 4);
      }
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
  }

  function drawHUD(beat) {
    if (state === 'title') return;
    ctx.textBaseline = 'alphabetic';
    // score
    ctx.textAlign = 'left';
    ctx.font = `900 ${30 + beat * (fxMax ? 4 : 0)}px ${F_NUM}`;
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#0b0420';
    const sTxt = Math.floor(shownScore).toLocaleString();
    ctx.strokeText(sTxt, 16, 44);
    ctx.fillStyle = '#f5f0ff';
    ctx.fillText(sTxt, 16, 44);
    ctx.font = `700 12px ${F_NUM}`;
    ctx.fillStyle = 'rgba(245,240,255,.7)';
    ctx.fillText(`${Math.floor(dist / U)}m   LV ${level}   BEST ${best.toLocaleString()}`, 18, 64);
    // combo
    if (combo > 0) {
      ctx.textAlign = 'right';
      const big = 1 + Math.max(0, comboTimer - 2.75) * 3;
      ctx.save();
      ctx.translate(W - 16, 52);
      ctx.scale(big, big);
      ctx.font = `900 ${40}px ${F_NUM}`;
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#0b0420';
      ctx.strokeText(String(combo), 0, 0);
      ctx.fillStyle = fever > 0 ? hsl(hue, 100, 65) : '#ffe23d';
      ctx.fillText(String(combo), 0, 0);
      ctx.restore();
      ctx.font = `700 13px ${F_NUM}`;
      ctx.fillStyle = '#f5f0ff';
      ctx.fillText(`COMBO  ×${mult}${fever > 0 ? '  FEVER' : ''}`, W - 16, 72);
      // combo timer bar
      ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.fillRect(W - 136, 80, 120, 5);
      ctx.fillStyle = fever > 0 ? hsl(hue, 100, 65) : '#7dff4a';
      ctx.fillRect(W - 136, 80, 120 * clamp(comboTimer / 3, 0, 1), 5);
    }
    if (fever > 0) {
      ctx.textAlign = 'center';
      ctx.font = `22px ${F_POP}`;
      ctx.fillStyle = hsl(hue + 180, 100, 70);
      ctx.fillText(`FEVER ${fever.toFixed(1)}`, W / 2, 36);
    }
    if (state === 'play' && dist < U * 8) {
      ctx.textAlign = 'center';
      ctx.font = `22px ${F_POP}`;
      ctx.fillStyle = `rgba(245,240,255,${0.6 + Math.sin(tReal * 8) * 0.4})`;
      ctx.fillText('タップでジャンプ!!', W / 2, GY + 40);
    }
  }

  function draw() {
    const beat = beatPulse(performance.now());
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.save();
    if (fxMax) {
      const z = 1 + zoom + beat * 0.012;
      ctx.translate(PX, GY);
      ctx.scale(z, z);
      ctx.translate(-PX, -GY);
      if (shake > 0) {
        const s = shake * shake * 16;
        ctx.translate(rand(-s, s), rand(-s, s));
        ctx.rotate(rand(-0.02, 0.02) * shake);
      }
    }
    drawBackground(beat);
    drawGround(beat);
    drawObjects(beat);
    drawPlayer();
    drawParticles();
    ctx.restore();
    drawSpeedLines();
    drawPops();
    drawHUD(beat);
    // fever frame
    if (fever > 0) {
      ctx.strokeStyle = hsl(hue, 100, 60, 0.8);
      ctx.lineWidth = 10 + beat * (fxMax ? 8 : 0);
      ctx.strokeRect(0, 0, W, H);
    }
    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    // flash (capped so it never strobes at full white)
    if (flash > 0 && fxMax) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(0.4, flash)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- loop ----------
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0, (ts - lastFrame) / 1000));
    lastFrame = ts;
    scheduler();
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  const titleOv = document.getElementById('titleOv');
  const overOv = document.getElementById('overOv');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const fxBtn = document.getElementById('fxBtn');
  const fxBtn2 = document.getElementById('fxBtn2');
  const muteBtn = document.getElementById('muteBtn');
  let resultAt = 0;

  function renderSettings() {
    const t = fxMax ? '演出：MAX' : '演出：ひかえめ';
    fxBtn.textContent = t;
    fxBtn2.textContent = t;
    muteBtn.textContent = muted ? '音：OFF' : '音：ON';
    document.getElementById('titleBest').textContent = `BEST ${best.toLocaleString()}`;
  }
  function toggleFx(e) {
    fxMax = !fxMax;
    try { localStorage.setItem('dopa-fx', fxMax ? 'max' : 'low'); } catch (err) {}
    renderSettings();
    e.currentTarget.blur();
  }
  fxBtn.addEventListener('click', toggleFx);
  fxBtn2.addEventListener('click', toggleFx);
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.7;
    renderSettings();
    muteBtn.blur();
  });

  function startGame() {
    initAudio();
    startMusic();
    attempts++;
    state = 'play';
    reset();
    titleOv.hidden = true;
    overOv.hidden = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', () => { if (performance.now() - resultAt > 350) startGame(); });

  function showResult() {
    const s = Math.floor(score);
    const isNew = s > best;
    if (isNew) { best = s; try { localStorage.setItem('dopa-best', String(best)); } catch (e) {} }
    let rank = 'C';
    if (s >= 30000) rank = '神'; else if (s >= 15000) rank = 'SS'; else if (s >= 8000) rank = 'S';
    else if (s >= 4000) rank = 'A'; else if (s >= 1500) rank = 'B';
    const rankEl = document.getElementById('rank');
    rankEl.textContent = rank;
    rankEl.classList.toggle('kanji', rank === '神');
    rankEl.style.animation = 'none'; void rankEl.offsetWidth; rankEl.style.animation = '';
    document.getElementById('cause').textContent = pick(CAUSES[deathCause]);
    document.getElementById('newrec').hidden = !isNew;
    document.getElementById('sScore').textContent = s.toLocaleString();
    document.getElementById('sDist').textContent = `${Math.floor(dist / U)}m`;
    document.getElementById('sCombo').textContent = String(maxCombo);
    document.getElementById('sBest').textContent = best.toLocaleString();
    overOv.hidden = false;
    state = 'result';
    resultAt = performance.now();
    renderSettings();
    if (isNew) for (let i = 0; i < 4; i++) setTimeout(() => burst(rand(W * 0.2, W * 0.8), rand(H * 0.2, H * 0.5), 50, null, 500), i * 180);
  }

  // ---------- input ----------
  function press() {
    if (state === 'play') {
      initAudio();
      holding = true;
      pressBuf = 0.12;
    } else if (state === 'result' && performance.now() - resultAt > 350) {
      startGame();
      holding = true;
    }
  }
  function release() { holding = false; }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} press(); });
  overOv.addEventListener('pointerdown', e => { if (e.target === overOv || !e.target.closest('button')) press(); });
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  window.addEventListener('pointerup', release);
  window.addEventListener('blur', release);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    release();
    if (!actx) return;
    if (document.hidden) actx.suspend(); else actx.resume();
  });
  const KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter'];
  window.addEventListener('keydown', e => {
    if (!KEYS.includes(e.code)) return;
    if (e.target && e.target.tagName === 'BUTTON' && state !== 'play') return;
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'title') { startGame(); holding = true; return; }
    press();
  });
  window.addEventListener('keyup', e => { if (KEYS.includes(e.code)) release(); });

  // ---------- boot ----------
  function boot(data) {
    if (data) {
      if (data.best > best) best = data.best;
      if (data.attempts) attempts = data.attempts;
    }
    resize();
    reset();
    renderSettings();
    requestAnimationFrame(ts => { lastFrame = ts; requestAnimationFrame(frame); });
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ best, attempts }));
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
